name: Deploy no GitHub Pages (site + app Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Bloqueia a publicação se alguma tela quebrar a ordem dos hooks do React (causa de tela de erro)
      - name: Verificação das telas
        run: npx oxlint --react-plugin -A all -D react-hooks/rules-of-hooks src

      - name: Build do site
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # O app Android é um "casco" que abre o site publicado (atualizações do site chegam no app na hora).
      # O APK vai junto com o site em /downloads/fields.apk, com /downloads/version.json para o aviso de atualização.
      - name: Build do app Android (APK)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          . android/version.properties
          export APP_VERSION_CODE=$VERSION_CODE APP_VERSION_NAME=$VERSION_NAME
          npx cap sync android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fields.p12"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/fields.p12" ANDROID_KEY_ALIAS=fields
            TASK=assembleRelease; OUT=release/app-release.apk; SIGNED=true
          else
            echo "::warning::Segredos de assinatura ausentes: gerando APK de teste (debug)."
            TASK=assembleDebug; OUT=debug/app-debug.apk; SIGNED=false
          fi
          cd android && chmod +x gradlew && ./gradlew "$TASK" --no-daemon --stacktrace
          cd ..
          mkdir -p dist/downloads
          cp "android/app/build/outputs/apk/$OUT" dist/downloads/fields.apk
          SIZE=$(stat -c%s dist/downloads/fields.apk)
          printf '{"versionCode":%s,"versionName":"%s","size":%s,"signed":%s,"date":"%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$SIZE" "$SIGNED" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/downloads/version.json
          cat dist/downloads/version.json
          rm -f "$RUNNER_TEMP/fields.p12"

      # ---------- VPS da Hostinger: haydenfernandes.tech/quallit-tutoriais/ ----------
      # Segredo necessário: VPS_DEPLOY_KEY — chave SSH privada do usuário "publicador" da VPS
      # (só grava em /var/www/haydenfernandes.tech/...). Sem o segredo, este passo é pulado.
      # O site é gerado de novo com o endereço da VPS; o APK e o version.json vão junto.
      - name: Publicar na VPS (haydenfernandes.tech/quallit-tutoriais/)
        env:
          CHAVE: ${{ secrets.VPS_DEPLOY_KEY }}
          VITE_BASE: /quallit-tutoriais/
          VITE_PUBLIC_URL: https://haydenfernandes.tech/quallit-tutoriais
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CHAVE" ]; then echo "::warning::VPS NÃO publicada: cadastre o segredo VPS_DEPLOY_KEY."; exit 0; fi
          npx vite build --outDir dist-vps
          mkdir -p dist-vps/downloads
          cp dist/downloads/fields.apk dist/downloads/version.json dist-vps/downloads/
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          echo "189.24.1.72 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB/Ly6zingGtSBqI9JsW62Ws492W7hU2vlWIBivkwoWX" >> ~/.ssh/known_hosts
          rsync -rlt --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r -e "ssh -i ~/.ssh/vps -o StrictHostKeyChecking=yes" \
            dist-vps/ publicador@189.24.1.72:/var/www/haydenfernandes.tech/quallit-tutoriais/
          rm -f ~/.ssh/vps
          echo "Publicado na VPS: https://haydenfernandes.tech/quallit-tutoriais/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
