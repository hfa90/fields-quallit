<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Fields</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f5f5f7; font-family: -apple-system, Roboto, "Segoe UI", sans-serif; color: #1c1c1e; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; box-sizing: border-box; }
    .logo { width: 72px; height: 72px; border-radius: 18px; background: #1A9CA9; display: grid; place-items: center; box-shadow: 0 8px 24px -10px rgba(0,0,0,.35); }
    h1 { font-size: 22px; margin: 24px 0 8px; letter-spacing: -.02em; }
    p { font-size: 15px; color: #636366; line-height: 1.5; max-width: 320px; margin: 0; }
    button { margin-top: 28px; height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #15828d; color: #fff; font-size: 17px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg width="46" height="46" viewBox="29 -5.5 160 160"><defs><mask id="c" maskUnits="userSpaceOnUse" x="0" y="-10" width="225" height="170"><rect x="0" y="-10" width="225" height="170" fill="#fff"/><line x1="128" y1="91" x2="200" y2="163" stroke="#000" stroke-width="46"/></mask></defs><circle cx="109" cy="74" r="54" fill="none" stroke="#fff" stroke-width="26" mask="url(#c)"/><line x1="132" y1="95" x2="162" y2="125" stroke="#FE811E" stroke-width="28" stroke-linecap="round"/></svg>
    </div>
    <h1>Sem conexão</h1>
    <p>Conecte-se à internet para abrir o Fields. Depois do primeiro acesso, os tutoriais salvos para uso offline abrem mesmo sem sinal.</p>
    <button onclick="location.href='https://hfa90.github.io/fields-quallit/'">Tentar novamente</button>
  </div>
</body>
</html>
